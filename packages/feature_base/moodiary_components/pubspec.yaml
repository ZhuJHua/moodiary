name: moodiary_components
description: "UI shared by feature packages that does not belong in mui."
version: 0.0.1
publish_to: none

resolution: workspace

environment:
  sdk: ">=3.14.0"
  flutter: ">=3.50.0"

dependencies:
  riverpod_annotation: 4.0.8
  flutter:
    sdk: flutter

  moodiary_content: 0.0.1
  fast_image: 0.0.1
  moodiary_files: 0.0.1
  moodiary_http: 0.0.1
  moodiary_logging: 0.0.1
  moodiary_storage: 0.0.1
  moodiary_i18n: 0.0.1
  moodiary_models: 0.0.1
  moodiary_platform: 0.0.1
  moodiary_utils: 0.0.1
  mui: 0.0.1

  flutter_riverpod: 3.5.0
  path: 1.9.1

  cached_network_image_ce: 4.13.2

  flutter_svg: 2.5.1
  re_highlight: 0.0.3
  photo_view: 0.15.0
  dismissible_page: 2.1.1
  audioplayers: 7.0.0-dev.0

dev_dependencies:
  riverpod_generator: 4.0.10
  flutter_test:
    sdk: flutter
  moodiary_lint: 0.0.1
  build_runner: 2.17.1

flutter:
  assets:
    - assets/brand/
