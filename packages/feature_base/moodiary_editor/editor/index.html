<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Moodiary Editor</title>
  <script>
    // 早于模块脚本装上，启动期的错误也能报给 Flutter
    (function () {
      function send(payload) {
        if (window.MoodiaryEditor) {
          window.MoodiaryEditor.postMessage(JSON.stringify({ type: 'error', payload: JSON.stringify(payload) }))
        }
      }
      window.addEventListener('error', function (e) {
        send({
          kind: 'error',
          message: e.message,
          source: e.filename,
          lineno: e.lineno,
          colno: e.colno,
          stack: e.error && e.error.stack
        })
      })
      window.addEventListener('unhandledrejection', function (e) {
        var r = e.reason
        send({
          kind: 'unhandledrejection',
          message: r && (r.message || String(r)),
          stack: r && r.stack
        })
      })
    })()
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
