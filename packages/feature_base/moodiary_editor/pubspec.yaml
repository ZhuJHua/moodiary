description: "Diary editor with autosave, toolbar, media and metadata chrome."
version: 0.0.1
publish_to: none

resolution: workspace

environment:
  sdk: ">=3.13.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_tiptap: 0.0.1
  fast_image: 0.0.1
  moodiary_native: 0.0.1
  moodiary_files: 0.0.1
  moodiary_platform: 0.0.1
  moodiary_http: 0.0.1
  moodiary_logging: 0.0.1
  moodiary_storage: 0.0.1
  moodiary_theme: 0.0.1
