publish_to: none

resolution: workspace

environment:
  sdk: ">=3.14.0"
  flutter: ">=3.50.0"

dependencies:
  riverpod_annotation: 4.0.8
  flutter_riverpod: 3.5.0
  flutter:
    sdk: flutter

  moodiary_content: 0.0.1
  moodiary_i18n: 0.0.1
  moodiary_router: 0.0.1
  moodiary_theme: 0.0.1
  mui: 0.0.1
  share_plus: 13.3.1
  url_launcher: 6.3.3
  moodiary_files: 0.0.1
  moodiary_logging: 0.0.1
  moodiary_storage: 0.0.1
  moodiary_data: 0.0.1
  moodiary_models: 0.0.1
  moodiary_platform: 0.0.1

  path: 1.9.1
  pub_semver: 2.2.1

dev_dependencies:
  riverpod_generator: 4.0.10
  build_runner: 2.17.1
  drift: 2.35.4
  flutter_test:
    sdk: flutter
  moodiary_lint: 0.0.1
