name: moodiary_data
description: "SQLite database on drift, repositories, controllers and shared transient state."
version: 0.0.1
publish_to: none

resolution: workspace

environment:
  sdk: ">=3.14.0"
  flutter: ">=3.50.0"

dependencies:
  flutter:
    sdk: flutter

  fast_image: 0.0.1
  sqlite3_simple:
    git:
      url: https://github.com/ZhuJHua/sqlite3_simple.git
      ref: e63079e
  moodiary_di: 0.0.1
  moodiary_files: 0.0.1
  moodiary_storage: 0.0.1
  crypto: 3.0.8
  drift: 2.35.4
  injectable: 3.0.0
  sqlite3: 3.9.2
  moodiary_theme: 0.0.1
  moodiary_logging: 0.0.1
  moodiary_ml: 0.0.1
  moodiary_models: 0.0.1
  sqlite3_vec: 0.1.3
  moodiary_utils: 0.0.1

  meta: 1.19.0

  riverpod_annotation: 4.0.8

dev_dependencies:
  moodiary_platform: 0.0.1
  flutter_test:
    sdk: flutter
  flutter_riverpod: 3.5.0
  moodiary_lint: 0.0.1
  build_runner: 2.16.1
  injectable_generator: 3.1.3
  riverpod_generator: 4.0.10
  drift_dev: 2.35.3
