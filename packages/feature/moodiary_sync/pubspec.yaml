name: moodiary_sync
description: "Moodiary 同步：增量引擎 + 编解码/密钥 + WebDAV/S3/本地后端 + 自动同步 + 备份 UI（两端可复用的 feature 包）。引擎与 providers 保持 widget-free（src/data + src/application）。"
version: 0.0.1
publish_to: none

resolution: workspace

environment:
  sdk: ">=3.13.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

  moodiary_di: 0.0.1
  moodiary_files: 0.0.1
  moodiary_http: 0.0.1
  moodiary_logging: 0.0.1
  moodiary_platform: 0.0.1
  moodiary_storage: 0.0.1
  moodiary_models: 0.0.1
  moodiary_data: 0.0.1
  moodiary_i18n: 0.0.1
  moodiary_components: 0.0.1
  moodiary_router: 0.0.1
  moodiary_rust: 0.0.1
  moodiary_utils: 0.0.1
  mui: 0.0.1

  flutter_riverpod: 3.4.2
  riverpod_annotation: 4.0.6
  injectable: 3.0.0
  file: 7.0.1
  bonsoir: 7.1.5
  path: 1.9.1
  pool: 1.5.2
  share_plus: 13.3.0
  synchronized: 3.4.1+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  moodiary_lint: 0.0.1
  build_runner: 2.16.0
  riverpod_generator: 4.0.8
  injectable_generator: 3.1.3
  fake_async: 1.3.3
