name: moodiary_sync
description: "Moodiary 同步：增量引擎 + 编解码/密钥 + WebDAV/S3/本地后端 + 自动同步 + 备份 UI（两端可复用的 feature 包）。引擎与 providers 保持 widget-free（src/data + src/application）。"
version: 0.0.1
publish_to: none

resolution: workspace

environment:
  sdk: ">=3.12.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

  moodiary_core: 0.0.1
  moodiary_models: 0.0.1
  moodiary_data: 0.0.1
  moodiary_ui: 0.0.1
  moodiary_router: 0.0.1
  moodiary_rust: 0.0.1
  moodiary_scan: 0.0.1

  flutter_riverpod: 3.3.2
  riverpod_annotation: 4.0.3
  go_router: 17.3.0
  file: 7.0.1
  file_picker: 12.0.0-beta.7
  intl: 0.20.2
  path: 1.9.1
  pool: 1.5.2
  share_plus: 13.2.0
  synchronized: 3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  moodiary_lint: 0.0.1
  build_runner: 2.15.1
  riverpod_generator: 4.0.4
  fake_async: 1.3.3
