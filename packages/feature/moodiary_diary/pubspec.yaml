name: moodiary_diary
description: "Diary detail and editing, search, categories, calendar, map, graph, recycle bin and management."
version: 0.0.1
publish_to: none

resolution: workspace

environment:
  sdk: ">=3.13.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

  fast_image: 0.0.1
  fast_tokenizer: 0.0.1
  moodiary_components: 0.0.1
  moodiary_data: 0.0.1
  moodiary_di: 0.0.1
  moodiary_editor: 0.0.1
  moodiary_files: 0.0.1
  moodiary_i18n: 0.0.1
  moodiary_logging: 0.0.1
