name: moodiary_editor
description: "Moodiary diary editor — an embeddable TipTap (webview) editor widget + headless markdown→JSON converter."
version: 0.0.1
publish_to: none

resolution: workspace

environment:
  sdk: ">=3.12.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: 4.14.0
  webview_flutter_android: 4.13.0
  webview_flutter_wkwebview: 3.26.0
  flutter_inappwebview_windows: 0.7.0-beta.3
  flutter_inappwebview_platform_interface: 1.4.0-beta.3
  shelf: 1.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  assets:
    - assets/editor/
