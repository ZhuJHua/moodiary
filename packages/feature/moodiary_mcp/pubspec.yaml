version: 0.0.1
publish_to: none

resolution: workspace

environment:
  sdk: ">=3.14.0"
  flutter: ">=3.50.0"

dependencies:
  flutter:
    sdk: flutter

  moodiary_data: 0.0.1
  moodiary_tools: 0.0.1
  moodiary_files: 0.0.1
  moodiary_i18n: 0.0.1
  moodiary_logging: 0.0.1
  moodiary_models: 0.0.1
  moodiary_native: 0.0.1
  moodiary_platform: 0.0.1
  moodiary_storage: 0.0.1
  moodiary_utils: 0.0.1

  injectable: 3.0.0
  mcp_dart: 2.4.4
  synchronized: 3.6.1+1

dev_dependencies:
  fast_image: 0.0.1
  moodiary_di: 0.0.1
  flutter_test:
    sdk: flutter
  moodiary_lint: 0.0.1
  drift: 2.35.4
  build_runner: 2.16.1
  injectable_generator: 3.1.3
