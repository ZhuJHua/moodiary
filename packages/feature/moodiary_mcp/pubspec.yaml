name: moodiary_mcp
description: "Local MCP server that lets external MCP clients read and edit diaries."
version: 0.0.1
publish_to: none

resolution: workspace

environment:
  sdk: ">=3.14.0"
  flutter: ">=3.50.0"

dependencies:
  riverpod_annotation: 4.0.8
  flutter_riverpod: 3.5.0
  flutter:
    sdk: flutter

  gap: 3.1.0
  moodiary_files: 0.0.1
  moodiary_router: 0.0.1
  moodiary_semantic: 0.0.1
  mui: 0.0.1
  moodiary_data: 0.0.1
  moodiary_tools: 0.0.1
  moodiary_i18n: 0.0.1
  moodiary_logging: 0.0.1
  moodiary_native: 0.0.1
  moodiary_platform: 0.0.1
  moodiary_storage: 0.0.1
  moodiary_utils: 0.0.1

  mcp_dart: 2.4.4
  synchronized: 3.6.1+1

dev_dependencies:
  riverpod_generator: 4.0.10
  moodiary_content: 0.0.1
  moodiary_models: 0.0.1
  flutter_test:
    sdk: flutter
  moodiary_lint: 0.0.1
  drift: 2.35.4
  build_runner: 2.17.1
