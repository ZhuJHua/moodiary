name: moodiary_editor_host
description: "Moodiary 日记编辑宿主：MoodiaryEditor 接线、EditorBody、自动保存控制器、分类选择、地理/天气采集、录音 —— 两端复用的编辑子系统。"
version: 0.0.1
publish_to: none

resolution: workspace

environment:
  sdk: ">=3.12.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

  moodiary_core: 0.0.1
  moodiary_models: 0.0.1
  moodiary_data: 0.0.1
  moodiary_ui: 0.0.1
  moodiary_l10n: 0.0.1
  moodiary_router: 0.0.1
  moodiary_rust: 0.0.1
  moodiary_utils: 0.0.1
  moodiary_editor: 0.0.1

  flutter_riverpod: 3.3.2
  riverpod_annotation: 4.0.3
  freezed_annotation: 3.1.0
  json_annotation: 4.12.0
  file_picker: 12.0.0-beta.7
  image_picker: 1.2.3
  record: 7.1.1
  flutter_quill: 11.5.1
  latlong2: 0.9.1
  intl: 0.20.2
  path: 1.9.1
  geolocator:
    git:
      url: https://github.com/ZhuJHua/flutter-geolocator.git
      path: geolocator
      ref: 96718c1ac20e3fb3d5fd9518b74ed6613000a7e6

dev_dependencies:
  flutter_test:
    sdk: flutter
  moodiary_lint: 0.0.1
  build_runner: 2.15.0
  freezed: 3.2.6-dev.1
  json_serializable: 6.14.0
  riverpod_generator: 4.0.4
