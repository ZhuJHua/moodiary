name: moodiary_assistant
description: "Moodiary AI assistant — a self-contained feature + route module: chat UI, tool-calling agent (rig), LLM provider management, and its own routes."
version: 0.0.1
publish_to: none

resolution: workspace

environment:
  sdk: ">=3.12.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

  moodiary_router: 0.0.1
  moodiary_rust: 0.0.1
  moodiary_utils: 0.0.1
  moodiary_models: 0.0.1
  moodiary_l10n: 0.0.1
  moodiary_core: 0.0.1
  moodiary_data: 0.0.1
  moodiary_ui: 0.0.1

  flutter_riverpod: 3.3.2
  riverpod_annotation: 4.0.3
  gpt_markdown: 1.1.8
  genui: 0.10.0
  a2ui_core: 0.0.1-wip002
  json_schema_builder: 0.1.6
  flutter_chat_ui: 2.11.1
  flutter_chat_core: 2.9.0
  chat_bottom_container: 0.5.1
  url_launcher: 6.3.2
  meta: 1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  moodiary_lint: 0.0.1
  build_runner: 2.15.1
  riverpod_generator: 4.0.4
