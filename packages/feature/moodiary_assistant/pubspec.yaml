name: moodiary_assistant
description: "Moodiary AI assistant — a self-contained feature + route module: chat UI, tool-calling agent (rig), LLM provider management, and its own routes."
version: 0.0.1
publish_to: none

resolution: workspace

environment:
  sdk: ">=3.13.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

  fast_tokenizer: 0.0.1
  moodiary_components: 0.0.1
  moodiary_data: 0.0.1
  moodiary_di: 0.0.1
  moodiary_files: 0.0.1
  moodiary_http: 0.0.1
  moodiary_i18n: 0.0.1
  moodiary_models: 0.0.1
  moodiary_router: 0.0.1
  moodiary_rust: 0.0.1
  moodiary_storage: 0.0.1
  moodiary_utils: 0.0.1
  mui: 0.0.1

  drift: 2.34.4
  gap: 3.0.1
  flutter_riverpod: 3.4.3
  riverpod_annotation: 4.0.7
  gpt_markdown: 1.2.1
  json_schema_builder: 0.1.7
  url_launcher: 6.3.2
  meta: 1.19.0
  injectable: 3.0.0
  flutter_js:
    git:
      url: https://github.com/ZhuJHua/flutter_js.git
      ref: 2dd6d4d16352888d018c81b4fb3168bac7a17650

dev_dependencies:
  flutter_test:
    sdk: flutter
  moodiary_lint: 0.0.1
  build_runner: 2.16.1
  riverpod_generator: 4.0.9
  injectable_generator: 3.1.3
