name: moodiary_media
description: "Attachment library: browse images, video, audio and files from diaries."
version: 0.0.1
publish_to: none

resolution: workspace

environment:
  sdk: ">=3.14.0"
  flutter: ">=3.50.0"

dependencies:
  flutter:
    sdk: flutter

  fast_image: 0.0.1
  moodiary_files: 0.0.1
  moodiary_logging: 0.0.1
  moodiary_models: 0.0.1
  moodiary_data: 0.0.1
  moodiary_di: 0.0.1
  moodiary_components: 0.0.1
  moodiary_i18n: 0.0.1
  moodiary_router: 0.0.1
  moodiary_utils: 0.0.1

  flutter_riverpod: 3.5.0
  mime: 2.1.0
  path: 1.9.1
  share_plus: 13.3.1
  riverpod_annotation: 4.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  moodiary_lint: 0.0.1
  build_runner: 2.16.1
  riverpod_generator: 4.0.10
