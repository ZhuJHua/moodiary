name: moodiary_media
description: "Moodiary 媒体库：图片 / 音视频总览、清理与查看器（两端可复用的 feature 包）。"
version: 0.0.1
publish_to: none

resolution: workspace

environment:
  sdk: ">=3.12.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

  moodiary_core: 0.0.1
  moodiary_models: 0.0.1
  moodiary_data: 0.0.1
  moodiary_ui: 0.0.1
  moodiary_l10n: 0.0.1
  moodiary_utils: 0.0.1
  mui: 0.0.1

  flutter_riverpod: 3.3.2
  riverpod_annotation: 4.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  moodiary_lint: 0.0.1
  build_runner: 2.15.1
  riverpod_generator: 4.0.4
