name: moodiary_storage
description: "存储：KV（MMKV）、SecureKV（钥匙串）、Isar 数据库句柄。不认识文件布局与领域类型。"
version: 0.0.1
publish_to: none

resolution: workspace

environment:
  sdk: ">=3.13.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

  moodiary_di: 0.0.1
  moodiary_logging: 0.0.1
  moodiary_platform: 0.0.1
  moodiary_rust: 0.0.1
  isar_plus: 1.3.9
  isar_plus_flutter_libs: 1.3.9
  mmkv: 2.4.2
  shared_preferences: 2.5.5
  flutter_secure_storage: 11.0.0
  path: 1.9.1
  injectable: 3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  moodiary_lint: 0.0.1
  build_runner: 2.16.0
  injectable_generator: 3.1.3
  moodiary_files: any
  moodiary_http: any
  moodiary_theme: any
  moodiary_utils: any
