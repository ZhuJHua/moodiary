name: moodiary_preferences
description: "Moodiary 应用级偏好设置状态：主题 / locale / 字体 / 缓存控制器（app-global settings），两端复用。"
version: 0.0.1
publish_to: none

resolution: workspace

environment:
  sdk: ">=3.13.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

  moodiary_core: 0.0.1
  mui: 0.0.1
  moodiary_data: 0.0.1
  moodiary_models: 0.0.1

  flutter_riverpod: 3.4.2
  riverpod_annotation: 4.0.6
  freezed_annotation: 3.1.0
  intl: 0.20.3
  path: 1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  moodiary_lint: 0.0.1
  build_runner: 2.16.0
  riverpod_generator: 4.0.8
  freezed: 4.0.0-dev.3
