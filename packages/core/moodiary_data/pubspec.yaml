version: 0.0.1
publish_to: none

resolution: workspace

environment:
  sdk: ">=3.12.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

  moodiary_core: 0.0.1
  moodiary_models: 0.0.1
  moodiary_rust: 0.0.1
  moodiary_utils: 0.0.1

  isar_plus: 1.3.7
  fpdart: 1.2.0
  flutter_quill: 11.5.1

  flutter_riverpod: 3.3.2
  riverpod_annotation: 4.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  moodiary_lint: 0.0.1
  build_runner: 2.15.0
  riverpod_generator: 4.0.4
