name: moodiary_core
description: "Moodiary infrastructure (infra) — DI, storage (Isar/KV/Secure), network, platform service, app-wide theming, values and infra utils."
version: 0.0.1
publish_to: none

resolution: workspace

environment:
  sdk: ">=3.12.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

  moodiary_l10n: 0.0.1
  moodiary_models: 0.0.1
  moodiary_rust: 0.0.1
  moodiary_utils: 0.0.1

  get_it: 9.2.1
  isar_plus: 1.3.9
  isar_plus_flutter_libs: 1.3.9
  shared_preferences: 2.5.5
  flutter_secure_storage: 11.0.0

  path: 1.9.1
  path_provider: 2.1.6
  cross_file: 0.3.5+4
  mime: 2.0.0
  file_picker: 12.0.0-beta.7
  heif_converter: 1.0.7
  gal: 2.3.3
  fc_native_video_thumbnail: 3.0.1

  dynamic_color: 1.9.0
  # 与 Flutter SDK 的 packages/flutter/pubspec.yaml 同钉，改前先核对那边。
  material_color_utilities: 0.13.0
  logger: 2.7.0
  lucide_icons_flutter: 3.1.15

dev_dependencies:
  flutter_test:
    sdk: flutter
  moodiary_lint: 0.0.1
