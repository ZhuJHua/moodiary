name: moodiary_core
description: "Moodiary infrastructure (infra) — DI, storage (Isar/KV/Secure), network, platform service, app-wide theming/notifications, values and infra utils."
version: 0.0.1
publish_to: none

resolution: workspace

environment:
  sdk: ">=3.12.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

  moodiary_l10n: 0.0.1
  moodiary_models: 0.0.1
  moodiary_rust: 0.0.1
  moodiary_utils: 0.0.1

  get_it: 9.2.1
  isar_plus: 1.3.7
  # 原生库：无 Dart import，但必须留在依赖图里才会被打包（Isar 的 owner 包持有）。
  isar_plus_flutter_libs: 1.3.7
  shared_preferences: 2.5.5
  flutter_secure_storage: 10.3.1

  path: 1.9.1
  path_provider: 2.1.6
  cross_file: 0.3.5+4
  mime: 2.0.0
  file_picker: 12.0.0-beta.7
  heif_converter: 1.0.7
  gal: 2.3.3
  fc_native_video_thumbnail: 3.0.1

  dynamic_color: 1.8.1
  flutter_quill: 11.5.1
  flutter_smart_dialog: 5.1.1
  font_awesome_flutter: 11.0.0
  riverpod_annotation: 4.0.3
  logger: 2.7.0
  meta: 1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  moodiary_lint: 0.0.1
