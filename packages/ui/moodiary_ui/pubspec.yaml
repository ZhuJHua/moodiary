name: moodiary_ui
description: "Moodiary shared UI kit (product) — business-agnostic reusable widgets (basic + common), consumed by both the mobile and desktop apps."
version: 0.0.1
publish_to: none

resolution: workspace

environment:
  sdk: ">=3.12.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

  moodiary_core: 0.0.1
  moodiary_l10n: 0.0.1
  moodiary_utils: 0.0.1
  moodiary_rust: 0.0.1

  flutter_riverpod: 3.3.2
  modal_bottom_sheet: 3.0.0
  expressive_refresh: 0.1.2
  path: 1.9.1

  cached_network_image_ce: 4.9.0
  flutter_svg: 2.3.0

  photo_view: 0.15.0
  dismissible_page: 1.0.2

  video_player: 2.13.0
  chewie: 1.14.1
  audioplayers: 6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  moodiary_lint: 0.0.1
