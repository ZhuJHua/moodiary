name: moodiary_ui
description: "Moodiary UI 层：够不着 mui 的那几个组件——需要 core 基建（AppFiles / IHttpClient / MediaManager / MoodiaryKVs / logger）或 riverpod。业务无关的组件都在 package:mui。"
version: 0.0.1
publish_to: none

resolution: workspace

environment:
  sdk: ">=3.13.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

  moodiary_core: 0.0.1
  moodiary_l10n: 0.0.1
  moodiary_utils: 0.0.1
  mui: 0.0.1

  flutter_riverpod: 3.4.2
  path: 1.9.1

  cached_network_image_ce: 4.10.0

  photo_view: 0.15.0
  dismissible_page: 1.0.2
  audioplayers: 6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  moodiary_lint: 0.0.1
