name: moodiary_ui
description: "Moodiary shared UI kit (product) — business-agnostic reusable widgets (basic + common) plus the global toast."
version: 0.0.1
publish_to: none

resolution: workspace

environment:
  sdk: ">=3.12.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

  moodiary_core: 0.0.1
  moodiary_l10n: 0.0.1
  moodiary_utils: 0.0.1
  moodiary_rust: 0.0.1

  flutter_riverpod: 3.3.2
  # UI 层是这两个依赖的 owner 包，经 barrel 转发给上层（见 moodiary_ui.dart）。
  flutter_smart_dialog: 5.1.1
  font_awesome_flutter: 11.0.0
  modal_bottom_sheet: 3.0.0
  expressive_refresh: 0.1.2
  path: 1.9.1

  cached_network_image_ce: 4.9.1
  flutter_svg: 2.3.0

  photo_view: 0.15.0
  dismissible_page: 1.0.2

  video_player: 2.13.0
  audioplayers: 6.8.1
  # 全屏播放器的左右滑动调节：亮度只用 application 级（无需 WRITE_SETTINGS 权限），
  # 音量走系统媒体音量（否则我们的音量条会在用户按硬件键静音后说谎）。
  screen_brightness: 2.1.11
  volume_controller: 3.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  moodiary_lint: 0.0.1
