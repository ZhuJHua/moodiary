# 函数的签名行被吃掉，只剩函数体，analyze 直接一片红。IrBlock 的表格已为此改成具名
# IrRow（CST 生成器不支持嵌套 Vec<Vec<T>>，那个问题已经解决），剩下这个是上游 bug。
