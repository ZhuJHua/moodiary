[package]
name = "moodiary_rust"
version = "0.1.0"
edition = "2024"

[lib]
# 必须与 package.name 一致：产物名走 native_toolchain_rust 的
# `libraryFileName(libName ?? crateName, …)`，改了名 `RustLib.init()` 就找不着 .so。
# 不写也能构建（它会回落到 package.name），但 1.0.6 取 `lib.name` 用的是 `null as String`，
# 缺了会先 logger.severe 把整个 Cargo.toml 和一段栈打进构建日志，看着像崩了其实没崩。
name = "moodiary_rust"
crate-type = ["cdylib", "staticlib"]

[workspace]
members = ["crates/*/*"]

[workspace.dependencies]
anyhow = "=1.0.104"
futures = { version = "=0.3.34", default-features = false, features = ["std", "async-await"] }
serde_json = "=1.0.151"

reqwest = { version = "=0.13.4", default-features = false, features = [
    "rustls-no-provider",
    "gzip",
    "brotli",
    "deflate",
    "stream",
] }
rustls = { version = "=0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "=1.0.9"

ring = "=0.17.14"
argon2 = { version = "=0.6.0-rc.8", features = ["default"] }
zip = { version = "=8.6.0", default-features = false, features = ["aes-crypto", "deflate"] }

ttf-parser = { git = "https://github.com/ZhuJHua/ttf-parser", rev = "4a0ddfee643e4a25a3d1363241fa94b9c5f113c3", default-features = false, features = ["std", "variable-fonts"] }

jieba-rs = { version = "=0.10.3", default-features = false, features = ["default-dict"] }
# 关默认避 onig C 依赖；unstable_wasm 只为激活 fancy-regex 引擎（getrandom/wasm_js 仅作用于 wasm 目标）
tokenizers = { version = "=0.23.1", default-features = false, features = ["unstable_wasm"] }
unicode-segmentation = "=1.13.3"
rust-stemmers = "=1.2.0"

rig = { package = "rig-core", version = "=0.42.0", default-features = false, features = ["reqwest"] }
# 0.42 把 agent 运行时从 rig-core 拆了出来（AgentBuilder / 多轮工具循环都在这里）。
rig-agent = { version = "=0.42.0", default-features = false }

moodiary-archive = { path = "crates/foundation/archive" }
moodiary-crypto = { path = "crates/foundation/crypto" }
moodiary-font = { path = "crates/foundation/font" }
moodiary-hf-tokenizer = { path = "crates/foundation/hf_tokenizer" }
moodiary-text = { path = "crates/foundation/text" }
moodiary-assistant = { path = "crates/feature/assistant" }
moodiary-graph = { path = "crates/feature/graph" }

[dependencies]
flutter_rust_bridge = "=2.13.0"
anyhow = { workspace = true }

moodiary-archive = { workspace = true }
moodiary-assistant = { workspace = true }
moodiary-crypto = { workspace = true }
moodiary-font = { workspace = true }
moodiary-graph = { workspace = true }
moodiary-hf-tokenizer = { workspace = true }
moodiary-text = { workspace = true }


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

# 不要加 panic = "abort"：FRB 靠 catch_unwind 把 Rust panic 转成 Dart 异常，abort
# 会让第三方 crate（zip / rig）在脏输入上直接杀进程，而 Dart 侧
# 现成的 try/catch 本来兜得住。代价实测（arm64 release）：.so 42.52 → 46.00 MB、
# APK 40.2 → 41.6 MB，大头是 .text 里的 landing pad 而非 unwind 表本身。
# 注：改 [profile.*] 后必须 flutter clean 才会真正重编——构建钩子与 Gradle 两层都会
# 把上一次的 .so 当作最新，光删 .dart_tool/hooks_runner/moodiary_rust 不够。
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
