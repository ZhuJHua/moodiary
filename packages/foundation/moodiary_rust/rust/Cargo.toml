[package]
name = "moodiary_rust"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0-beta.5"
image = "0.25.10"
# 有损 WebP 编码（libwebp 绑定）；image crate 的 WebPEncoder 仅无损，照片场景不可用。
webp = "0.3.1"
fast_image_resize = { version = "6.0.0", features = ["image"] }
anyhow = "1.0.103"
ttf-parser = { git = "https://github.com/ZhuJHua/ttf-parser", rev = "4a0ddfee643e4a25a3d1363241fa94b9c5f113c3" }
ring = "0.17.14"
zip = { version = "8.6.0", default-features = false, features = ["aes-crypto", "deflate", "zstd", "time"] }
walkdir = "2.5.0"
# 只用分词（cut / cut_for_search）。tfidf / textrank 关键词抽取全仓无调用方，其 idf.txt
# 语料 2.6MB 是纯死重量；关掉后 posseg.txt 也被链接器 dead-strip（合计 -3.44MiB）。
jieba-rs = { version = "0.10.1", default-features = false, features = ["default-dict"] }
# net + fs：api::http_server 的监听/落盘、api::http 的流式文件上传。
tokio = { version = "1.52.3", features = ["net", "fs", "io-util", "sync", "macros"] }
tokio-util = { version = "0.7", features = ["io"] }
# 应用内 HTTP 服务（api::http_server）。hyper 栈已由 reqwest 引入，仅增开 server 特性。
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
url = "2"
unicode-segmentation = "1.13.3"
rust-stemmers = "1.2.0"
argon2 = { version = "0.6.0-rc.8", features = ["default", "rand_core"] }
minio = { version = "0.4.0", default-features = false, features = ["rustls-tls", "default-crypto"] }
reqwest_dav = { version = "0.3.3", default-features = false, features = ["rustls-tls"] }
bytes = "1"
futures = "0.3"
# AI 助手底层 agent 框架（pure Rust）。默认特性含 reqwest + derive + rustls，
# 与既有 minio / reqwest_dav 的 rustls-tls 一致，不引入 native-tls / openssl。
# 以 `rig` 为 crate 名引入（rig-core 的 lib 名为 rig_core，官方文档 / 示例统一用 `rig`）。
rig = { package = "rig-core", version = "0.40", default-features = false, features = ["reqwest", "derive", "rustls"] }
serde_json = "1"
# rig 的 reqwest 客户端在 reqwest 0.13 下默认用 rustls-platform-verifier 校验证书，
# 该校验器在 Android 上需平台上下文初始化、否则首个 TLS 连接即 panic。直接依赖
# reqwest/rustls/webpki-roots，自建走内置 webpki 根证书的客户端注入给 rig（见 assistant.rs）。
# gzip/brotli/deflate：api::http::HttpClient 用它自动协商 Accept-Encoding 并解压响应，
# 对齐旧 Dio(dart:io autoUncompress) 行为——部分服务端（如和风天气）会无条件返回 gzip。
reqwest = { version = "0.13", default-features = false, features = [
    "rustls",
    "gzip",
    "brotli",
    "deflate",
    # 流式请求体（Body::wrap_stream，api::http 文件上传）。
    "stream",
] }
rustls = "0.23"
webpki-roots = "1"
lofty = "0.24.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
