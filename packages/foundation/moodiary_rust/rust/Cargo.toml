[package]
name = "moodiary_rust"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "staticlib"]

[workspace]
members = ["crates/*/*"]

[workspace.dependencies]
anyhow = "=1.0.104"
bytes = "=1.12.1"
futures = { version = "=0.3.33", default-features = false, features = ["std", "async-await"] }
serde = { version = "=1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = "=1.0.151"
url = "=2.5.8"

tokio = { version = "=1.53.1", default-features = false }
tokio-util = { version = "=0.7.19", default-features = false, features = ["io"] }
hyper = { version = "=1.11.0", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "=0.1.20", default-features = false, features = ["tokio"] }
http-body-util = "=0.1.4"
reqwest = { version = "=0.13.4", default-features = false, features = [
    "rustls-no-provider",
    "gzip",
    "brotli",
    "deflate",
    "stream",
] }
rustls = { version = "=0.23.43", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "=1.0.9"
reqwest_dav = { version = "=0.3.3", default-features = false, features = ["rustls-tls-no-provider"] }
rusty-s3 = { version = "=0.10.2", default-features = false, features = ["rustcrypto"] }

ring = "=0.17.14"
argon2 = { version = "=0.6.0-rc.8", features = ["default", "rand_core"] }
zip = { version = "=8.6.0", default-features = false, features = ["aes-crypto", "deflate", "zstd", "time"] }
walkdir = "=2.5.0"

image = { version = "=0.25.10", default-features = false, features = [
    "bmp",
    "gif",
    "ico",
    "jpeg",
    "png",
    "tiff",
    "webp",
] }
webp = "=0.3.1"
fast_image_resize = { version = "=6.1.0", default-features = false, features = ["image"] }
ttf-parser = { git = "https://github.com/ZhuJHua/ttf-parser", rev = "4a0ddfee643e4a25a3d1363241fa94b9c5f113c3" }

jieba-rs = { version = "=0.10.3", default-features = false, features = ["default-dict"] }
unicode-segmentation = "=1.13.3"
rust-stemmers = "=1.2.0"

typst = "=0.15.1"
typst-pdf = "=0.15.1"
docx-rs = "=0.4.22"
syntect = { version = "=5.3.0", default-features = false, features = [
    "parsing",
    "regex-fancy",
    "plist-load",
    "yaml-load",
] }
two-face = { version = "=0.4.5", default-features = false, features = ["syntect-fancy"] }

rig = { package = "rig-core", version = "=0.42.0", default-features = false, features = ["reqwest", "derive"] }
# 0.42 把 agent 运行时从 rig-core 拆了出来（AgentBuilder / 多轮工具循环都在这里）。
rig-agent = { version = "=0.42.0", default-features = false }

moodiary-archive = { path = "crates/foundation/archive" }
moodiary-crypto = { path = "crates/foundation/crypto" }
moodiary-font = { path = "crates/foundation/font" }
moodiary-http = { path = "crates/foundation/http" }
moodiary-media = { path = "crates/foundation/media" }
moodiary-text = { path = "crates/foundation/text" }
moodiary-doc = { path = "crates/core/doc" }
moodiary-assistant = { path = "crates/feature/assistant" }
moodiary-export = { path = "crates/feature/export" }
moodiary-graph = { path = "crates/feature/graph" }
moodiary-sync = { path = "crates/feature/sync" }

[dependencies]
flutter_rust_bridge = "=2.13.0-beta.6"
anyhow = { workspace = true }
serde_json = { workspace = true }

moodiary-archive = { workspace = true }
moodiary-assistant = { workspace = true }
moodiary-crypto = { workspace = true }
moodiary-doc = { workspace = true }
moodiary-export = { workspace = true }
moodiary-font = { workspace = true }
moodiary-graph = { workspace = true }
moodiary-http = { workspace = true }
moodiary-media = { workspace = true }
moodiary-sync = { workspace = true }
moodiary-text = { workspace = true }


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

# 不要加 panic = "abort"：FRB 靠 catch_unwind 把 Rust panic 转成 Dart 异常，abort
# 会让第三方 crate（typst / image / zip）在脏输入上直接杀进程，而 Dart 侧
# 现成的 try/catch 本来兜得住。代价实测（arm64 release）：.so 42.52 → 46.00 MB、
# APK 40.2 → 41.6 MB，大头是 .text 里的 landing pad 而非 unwind 表本身。
# 注：改 [profile.*] 后必须 flutter clean 才会真正重编——构建钩子与 Gradle 两层都会
# 把上一次的 .so 当作最新，光删 .dart_tool/hooks_runner/moodiary_rust 不够。
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
