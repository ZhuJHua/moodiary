name: moodiary_rust
description: "Moodiary native (Rust) FFI package — self-contained (crate in rust/) exposing RustLib + generated Dart bindings; built and bundled via Native Assets build hooks."
version: 0.0.1
publish_to: none

resolution: workspace

environment:
  sdk: ">=3.12.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_rust_bridge: 2.13.0-beta.5
  flutter_rust_bridge_hooks: 2.13.0-beta.5

dev_dependencies:
  flutter_test:
    sdk: flutter
