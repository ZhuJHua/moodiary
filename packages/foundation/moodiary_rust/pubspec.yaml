name: moodiary_rust
description: "Moodiary native (Rust) FFI package — self-contained (crate in rust/) exposing RustLib + generated Dart bindings; built and bundled via Native Assets build hooks."
version: 0.0.1
publish_to: none

resolution: workspace

environment:
  sdk: ">=3.12.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_rust_bridge: 2.13.0-beta.6
  flutter_rust_bridge_hooks: 2.13.0-beta.6
  freezed_annotation: 3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: 2.15.1
  ffigen: 20.1.1
  freezed: 3.2.6-dev.1
