[package]
name = "fasttext"
version = "0.1.0"
edition = "2024"

[lib]
# 产物名 libfasttext.*：native_toolchain_rust 按 lib.name 取文件名，`FastTextLib.init()`
# 也按这个 stem 找库。
name = "fasttext"
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
anyhow = "=1.0.104"
jieba-rs = { version = "=0.10.3", default-features = false, features = ["default-dict"] }
# 关默认避 onig C 依赖；unstable_wasm 只为激活 fancy-regex 引擎（getrandom/wasm_js 仅作用于 wasm 目标）
tokenizers = { version = "=0.23.1", default-features = false, features = ["unstable_wasm"] }
unicode-segmentation = "=1.13.3"
rust-stemmers = "=1.2.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

# 与其他 fast_* 同口径；不要加 panic = "abort"（FRB 靠 catch_unwind 把 panic 转成 Dart 异常）。
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
