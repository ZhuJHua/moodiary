[package]
name = "fastllm"
version = "0.1.0"
edition = "2024"

[lib]
# 产物名 libfastllm.*：native_toolchain_rust 按 lib.name 取文件名，`FastLlmLib.init()`
# 也按这个 stem 找库。
name = "fastllm"
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
anyhow = "=1.0.104"
futures = { version = "=0.3.34", default-features = false, features = ["std", "async-await"] }
serde_json = "=1.0.151"
rig = { package = "rig-core", version = "=0.42.0", default-features = false, features = ["reqwest"] }
# 0.42 把 agent 运行时从 rig-core 拆了出来（AgentBuilder / 多轮工具循环都在这里）。
rig-agent = { version = "=0.42.0", default-features = false }
# rig 自带的网络能力就是 reqwest；客户端由 http_client.rs 自建（ring provider + Android webpki 根），
# 与 fast_http 的 client.rs 同一段逻辑。feature 集与 fast_http 保持一致，别单独漂。
reqwest = { version = "=0.13.4", default-features = false, features = [
    "rustls-no-provider",
    "gzip",
    "brotli",
    "deflate",
    "stream",
] }
rustls = { version = "=0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "=1.0.9"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

# 与其他 fast_* 同口径；不要加 panic = "abort"（FRB 靠 catch_unwind 把 panic 转成 Dart 异常）。
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
