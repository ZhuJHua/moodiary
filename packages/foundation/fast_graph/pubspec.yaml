name: fast_graph
description: "Fast force-directed graph layout — ForceAtlas2 with Barnes-Hut, streamed frame by frame over a bare dart:ffi binding to its own Rust native library (libfastgraph), built with native_toolchain_rust."
version: 0.0.1
publish_to: none

resolution: workspace

environment:
  sdk: ">=3.13.0"
  flutter: ">=3.47.0"

dependencies:
  code_assets: 1.2.1
  ffi: 2.2.0
  flutter:
    sdk: flutter
  hooks: 2.2.0
  native_toolchain_rust: 1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  moodiary_lint: 0.0.1
