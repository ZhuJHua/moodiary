name: fast_zip
description: "Fast zip archives — writing (optionally AES-encrypted) and extracting with cancellation, backed by its own Rust native library (libfastzip) via flutter_rust_bridge."
version: 0.0.1
publish_to: none

resolution: workspace

environment:
  sdk: ">=3.13.0"
  flutter: ">=3.47.0"

dependencies:
  code_assets: 1.2.1
  flutter:
    sdk: flutter
  flutter_rust_bridge: 2.13.0
  flutter_rust_bridge_hooks: 2.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  ffigen: 21.0.0
  moodiary_lint: 0.0.1
