name: moodiary_utils
description: "Moodiary foundation utilities — leaf Dart/Flutter helpers, enums and text converters with no upward (data/feature/app) dependencies."
version: 0.0.1
publish_to: none

resolution: workspace

environment:
  sdk: ">=3.13.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

  # 叶子工具各自的外部依赖（与 app 共用 workspace 解析，钉版无 ^）。
  intl: 0.20.3
  synchronized: 3.4.1+1
  image_size_getter: 2.4.1
  connectivity_plus: 7.3.1
  network_info_plus: 8.2.1
  device_info_plus: 13.2.0
  package_info_plus: 10.2.1
  markdown: 7.3.1
  local_auth: 3.0.2
  uuid: 4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  moodiary_lint: 0.0.1
