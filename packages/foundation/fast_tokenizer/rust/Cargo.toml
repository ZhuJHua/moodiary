[package]
name = "fasttokenizer"
version = "0.1.0"
edition = "2024"

[lib]
# 改名即断：native_toolchain_rust 按 lib.name 出文件名，Dart 侧按同一 stem 找库。
name = "fasttokenizer"
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
anyhow = "=1.0.104"
tokenizers = { version = "=0.23.1", default-features = false, features = ["onig"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
