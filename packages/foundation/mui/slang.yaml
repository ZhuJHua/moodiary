# mui 组件自己要用的那十来个通用词。生成命令：dart tool/task.dart l10n。
#
# 类名/枚举名必须与 App 那份（moodiary_l10n）区分开：slang 生成的
# TranslationProvider / LocaleSettings / AppLocaleUtils 三个类名在生成器里是硬编码的，
# 只有下面这三项可配。所以生成物**不进 mui.dart barrel**，对外只露 MuiTranslationScope。
base_locale: zh
fallback_strategy: base_locale

# 关掉 slang 默认的 lazy。多实例跨包共享语种是 slang 官方支持的用法，已挂载的
# TranslationProvider 会在 updateState 里自己 loadLocale —— 但**我们在 runApp 之前就
# 切语种**（applyStoredLanguage），那时 provider 的 GlobalKey 还没注册（它在
# BaseTranslationProvider 的构造器里才 register），updateProviderState 遍历的是空集合。
# App 那棵没事：它自己那份 setLocale 会 await loadLocale。mui 这棵没人替它调，
# translationMap 里就只有 base(zh)，`map[current] ?? map[base]` 一路回落成中文。
#
# 不 lazy 之后表在构造时就填满，跟启动顺序彻底解耦。deferred 在移动端本来也不 defer
# （只有 dart2js / dart2wasm 会真的切块按需下载），十来个词全量编进来不值一提。
lazy: false

input_directory: lib/src/l10n/i18n
input_file_pattern: .i18n.json
output_directory: lib/src/l10n/i18n
output_file_name: mui_strings.g.dart

translate_var: muiL10n
class_name: MuiTranslations
enum_name: MuiAppLocale

flat_map: false
timestamp: false
statistics: false
