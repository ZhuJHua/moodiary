name: mui
description: "Another material design ui"
version: 0.0.1
publish_to: none

resolution: workspace

environment:
  sdk: ">=3.13.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  # Flutter 3.47 把 material 拆成独立包；SDK 内的 package:flutter/material.dart
  # 将于 2026-11 正式弃用。mui 是全仓唯一 import 它的地方。
  material_ui: 1.1.0
  lucide_icons_flutter: 3.1.17
  flutter_svg: 2.3.0
  cached_network_image_ce: 4.10.0
  # 与 Flutter SDK 的 packages/flutter/pubspec.yaml 同钉，改前先核对那边。
  # 纯 Dart 包（唯一依赖 collection），不违反「mui 不碰 material」。
  material_color_utilities: 0.13.0
  # mui 自己那十来个通用词走 slang，但用的是 locale_handling: false + 自己的
  # LocalizationsDelegate，不是 App 那种全局模式。见 slang.yaml 与 src/i18n/。
  # 两个都是运行时依赖（生成物在 lib/ 里 import 它们），slang 兼任 CLI 入口只是第二身份。
  slang: 4.19.0
  slang_flutter: 4.19.0

  # 迁入的组件带来的依赖：toast 走 smart_dialog、下拉刷新走 expressive_refresh、
  # 视频端口实现要 video_player 与两个系统能力插件。
  flutter_smart_dialog: 5.3.0
  expressive_refresh: 0.1.2
  video_player: 2.14.0
  screen_brightness: 2.1.11
  volume_controller: 3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  moodiary_lint: 0.0.1

flutter:
  # 和风天气图标字体。跟着 qweather_icon.dart 走：谁用图标谁带字体，
  # 调用方不需要自己在 pubspec 里再声明一遍。
  fonts:
    - family: qweather
      fonts:
        - asset: assets/fonts/qweather-icons.ttf
    # 文件类型角标用的圆角西文字体（Dosis，OFL-1.1，见同目录 Dosis-OFL.txt）。
    # 可变字体（wght 200–800），字重由 FontVariation 指定，见 file_type_icon.dart。
    - family: Dosis
      fonts:
        - asset: assets/fonts/Dosis.ttf
