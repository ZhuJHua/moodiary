name: mui
description: "Design system that supplements material_ui."
version: 0.0.1
publish_to: none

resolution: workspace

environment:
  sdk: ">=3.14.0" # Managed by Melos, change it in the bootstrap config of the root pubspec.yaml
  flutter: ">=3.50.0" # Managed by Melos, change it in the bootstrap config of the root pubspec.yaml

dependencies:
  cached_network_image_ce: 4.13.2 # Managed by Melos, change it in the bootstrap config of the root pubspec.yaml
  clock: 1.1.3 # Managed by Melos, change it in the bootstrap config of the root pubspec.yaml
  cupertino_ui: 1.1.7 # Managed by Melos, change it in the bootstrap config of the root pubspec.yaml
  flutter:
    sdk: flutter
  flutter_smart_dialog: 5.3.2
  flutter_svg: 2.5.1 # Managed by Melos, change it in the bootstrap config of the root pubspec.yaml
  glassmorphism: 4.0.0
  liquid_glass_widgets: 1.21.0
  lucide_icons_flutter: 4.0.3
  material_color_utilities: 0.13.0
  material_ui: 1.11.1
  skeletonizer: 3.0.0
  slang: 4.19.2 # Managed by Melos, change it in the bootstrap config of the root pubspec.yaml
  slang_flutter: 4.19.0 # Managed by Melos, change it in the bootstrap config of the root pubspec.yaml
  swift_transitions: 0.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  moodiary_lint: 0.0.1

flutter:
  fonts:
    - family: qweather
      fonts:
        - asset: assets/fonts/qweather-icons.ttf
    - family: Dosis
      fonts:
        - asset: assets/fonts/Dosis.ttf
