name: moodiary_native
description: "The app's only Flutter-to-native channel: every call into Android or iOS code goes through its pigeon APIs."
version: 0.0.1
publish_to: none

resolution: workspace

environment:
  sdk: ">=3.13.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  moodiary_lint: 0.0.1
  pigeon: 29.0.8

flutter:
  plugin:
    platforms:
      android:
        package: cn.yooss.moodiary_native
        pluginClass: MoodiaryNativePlugin
      ios:
        pluginClass: MoodiaryNativePlugin
