name: moodiary_i18n
description: "Moodiary 国际化（foundation）：slang 生成的 Translations，取串走 l10n / context.l10n。"
version: 0.0.1
publish_to: none

resolution: workspace

environment:
  sdk: ">=3.13.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  # slang_flutter 自带 slang，并提供 TranslationProvider / flutterLocale / supportedLocales。
  slang_flutter: 4.19.0
  intl: 0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  moodiary_lint: 0.0.1
  # `dart run slang` 的 CLI 入口（生成、analyze、migrate 都在这里）。
  slang: 4.19.0
