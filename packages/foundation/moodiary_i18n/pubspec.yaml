name: moodiary_i18n
description: "Moodiary 国际化（foundation）：slang 生成的 Translations，取串走 l10n / context.l10n。"
version: 0.0.1
publish_to: none

resolution: workspace

environment:
  sdk: ">=3.13.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  # 两个都是**运行时**依赖，不是构建期工具：生成的 strings.g.dart 就在 lib/ 里，
  # 它 import 'package:slang/generated.dart'（BaseTranslations / TranslationMetadata /
  # PluralResolver 都在那儿）并 import + export slang_flutter（TranslationProvider /
  # InheritedLocaleData）。slang 同时还是 `dart run slang` 的 CLI 入口，但那是它的第二个
  # 身份，不影响这里的归属。放 dev_dependencies 也能跑（slang_flutter 传递带了它，且生成物
  # 顶部的 ignore_for_file 把 depend_on_referenced_packages 压掉了），但那是碰巧。
  slang: 4.19.0
  slang_flutter: 4.19.0
  intl: 0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  moodiary_lint: 0.0.1
