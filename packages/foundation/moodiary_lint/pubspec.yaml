name: moodiary_lint
description: "Shared analyzer + lint configuration for the Moodiary workspace. Consumers `include: package:moodiary_lint/analysis_options.yaml`."
version: 0.0.1
publish_to: none

resolution: workspace

environment:
  sdk: ">=3.12.0"

# flutter_lints 作为**常规依赖**（非 dev）以便传递给引用方，使其 analysis_options 里的
# `include: package:flutter_lints/flutter.yaml` 可解析。
dependencies:
  flutter_lints: 6.0.0
