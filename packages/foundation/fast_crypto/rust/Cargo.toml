[package]
name = "fastcrypto"
version = "0.1.0"
edition = "2024"

[lib]
# 改名即断：native_toolchain_rust 按 lib.name 出文件名，Dart 侧按同一 stem 找库。
name = "fastcrypto"
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
anyhow = "=1.0.104"
ring = "=0.17.14"
argon2 = { version = "=0.6.0-rc.8", features = ["default"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
