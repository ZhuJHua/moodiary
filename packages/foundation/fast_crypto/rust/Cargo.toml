[package]
name = "fastcrypto"
version = "0.1.0"
edition = "2024"

[lib]
# 产物名 libfastcrypto.*：native_toolchain_rust 按 lib.name 取文件名，Dart 侧 `@Native`
# 经 hook 登记的 code asset（`src/ffi.dart`）解析符号，不用 dlopen。
name = "fastcrypto"
crate-type = ["cdylib", "staticlib"]

[dependencies]
anyhow = "=1.0.104"
ring = "=0.17.14"
# `parallel` feature 对我们无效（p=1 只有一条 lane），别开。
argon2 = { version = "=0.6.0-rc.8", features = ["default"] }

# 裸 FFI 没有 FRB 替我们兜 panic：每个 extern "C" 入口自己 catch_unwind，所以 panic 仍不 abort。
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
