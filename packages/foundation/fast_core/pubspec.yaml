name: fast_core
description: "reqwest client, hyper server, WebDAV/S3 access, rig chat and graph layout in one Rust library (libfastcore)."
version: 0.0.1
publish_to: none

resolution: workspace

environment:
  sdk: ">=3.13.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_rust_bridge: 2.13.0
  rust_hook: 0.0.1
  freezed_annotation: 3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: 2.16.1
  ffigen: 21.0.0
  freezed: 4.0.1
  moodiary_lint: 0.0.1
