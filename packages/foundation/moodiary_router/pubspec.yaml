name: moodiary_router
description: "Moodiary routing primitives — MoodiaryRouteBase + typed nav helpers over go_router; lets feature packages define type-safe routes without depending on the app."
version: 0.0.1
publish_to: none

resolution: workspace

environment:
  sdk: ">=3.13.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  go_router: 17.5.0
  # MaterialPage：go_router 认不出 material_ui 的 MaterialApp，Page 得路由自己给，
  # 详见 src/route_page.dart。
  material_ui: 1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  moodiary_lint: 0.0.1
