name: moodiary_ui
description: "Moodiary shared UI kit (product) — business-agnostic reusable widgets (basic + common), consumed by both the mobile and desktop apps."
version: 0.0.1
publish_to: none

resolution: workspace

environment:
  sdk: ">=3.12.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

  # 下层包。
  moodiary_core: 0.0.1
  moodiary_l10n: 0.0.1
  moodiary_utils: 0.0.1

  flutter_riverpod: 3.3.2
  dartx: 1.2.0
  modal_bottom_sheet: 3.0.0
  flutter_smart_dialog: 5.1.0
  easy_refresh: 3.5.1
  path: 1.9.1

  # 媒体播放
  video_player: 2.11.1
  chewie: 1.14.1
  audioplayers: 6.8.1

  # 二维码（仅生成 / 显示，相机扫码已移除）
  qr_flutter: 4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  moodiary_lint: 0.0.1
