name: moodiary_workspace
description: "Moodiary monorepo root — pub workspace + Melos coordinator (no app code lives here; the Flutter app is in mobile/)."
publish_to: "none"

environment:
  sdk: ">=3.12.0"

workspace:
  - mobile
  - desktop
  - packages/*/*

melos:
  categories:
    foundation:
      - packages/foundation/*
    core:
      - packages/core/*
    ui:
      - packages/ui/*
    feature:
      - packages/feature/*
  command:
    bootstrap:
      hooks:
        post: fvm dart tool/task.dart gen
  scripts:
    analyze:
      run: fvm dart tool/task.dart analyze
      description: 分层检查 + flutter analyze
    test:
      run: fvm dart tool/task.dart test
      description: 运行全部测试
    gen:
      run: fvm dart tool/task.dart gen
      description: 重新生成 Rust 绑定 + 编辑器资源
    gen-rust:
      run: fvm dart tool/task.dart gen-rust
      description: 重新生成 Rust FFI 绑定
    gen-editor:
      run: fvm dart tool/task.dart editor
      description: 构建编辑器单文件资源

dev_dependencies:
  melos: ^8.1.0

dependency_overrides:
  quill_native_bridge_windows: 0.1.0-beta.1
  cli_util: 0.5.0
