name: moodiary_workspace
description: "Moodiary monorepo root — pub workspace + Melos coordinator (no app code lives here; the Flutter app is in mobile/)."
publish_to: "none"

environment:
  sdk: ">=3.13.0"

workspace:
  - mobile
  - packages/*/*

melos:
  categories:
    foundation:
      - packages/foundation/*
    core:
      - packages/core/*
    feature_base:
      - packages/feature_base/*
    feature:
      - packages/feature/*
  scripts:
    analyze:
      run: fvm dart tool/task.dart analyze
      description: 分层检查 + flutter analyze
    test:
      run: fvm dart tool/task.dart test
      description: 全仓测试（CI 口径，melos 扫所有含 test 的包）
    test-mobile:
      run: fvm dart tool/task.dart test-mobile
      description: 只跑 mobile/ 的测试
    gen:
      run: fvm dart tool/task.dart gen
      description: 重新生成 Rust 绑定 + 编辑器资源
    gen-rust:
      run: fvm dart tool/task.dart gen-rust
      description: 重新生成 Rust FFI 绑定
    gen-editor:
      run: fvm dart tool/task.dart editor
      description: 构建编辑器单文件资源

dev_dependencies:
  melos: 8.5.0

dependency_overrides:
  cli_util: 0.5.2

# Native Assets 的 hooks user_defines 只认 workspace 根的这份 pubspec
# （flutter_tools 取 package_config.json 同级的 ../pubspec.yaml），放 mobile/ 无效。
# llamadart 收窄：只要 llama.cpp 家族（不拉 LiteRT-LM）。Android = Vulkan 优先
# （引擎侧 GpuBackend.auto，GPU 能用则用）+ 全套 CPU 变体兜底（运行时按设备
# 指令集挑最优，baseline 保底；体积账见 docs/local-rag.md §6.8）。
# Apple 端是 CPU+Metal 合体运行时，无需在此配置。
hooks:
  user_defines:
    llamadart:
      llamadart_native_runtimes: llama_cpp
      llamadart_native_backends:
        platforms:
          android:
            backends: [cpu, vulkan]
            cpu_profile: full
          windows:
            backends: [cpu, vulkan]
          linux:
            backends: [cpu, vulkan]
