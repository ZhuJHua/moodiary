name: moodiary_mobile
description: "Open source diary app built with Flutter and Rust."
publish_to: "none"
version: 2.9.2+98
environment:
  sdk: ">=3.14.0"
  flutter: ">=3.50.0"

resolution: workspace

dependencies:
  code_assets: 2.2.0
  hooks: 2.2.0
  flutter:
    sdk: flutter

  fast_image: 0.0.1
  moodiary_router: 0.0.1
  moodiary_assistant: 0.0.1
  moodiary_diary: 0.0.1
  moodiary_editor: 0.0.1
  moodiary_export: 0.0.1
  moodiary_lock: 0.0.1
  moodiary_media: 0.0.1
  moodiary_sync: 0.0.1
  moodiary_utils: 0.0.1
  moodiary_models: 0.0.1
  moodiary_i18n: 0.0.1
  moodiary_di: 0.0.1
  moodiary_files: 0.0.1
  moodiary_http: 0.0.1
  moodiary_logging: 0.0.1
  moodiary_native: 0.0.1
  moodiary_platform: 0.0.1
  moodiary_storage: 0.0.1
  moodiary_theme: 0.0.1
  mui: 0.0.1
  moodiary_data: 0.0.1
  moodiary_mcp: 0.0.1
  moodiary_reminder: 0.0.1
  moodiary_ml: 0.0.1
  moodiary_migration: 0.0.1
  moodiary_preferences: 0.0.1
  moodiary_components: 0.0.1
  moodiary_picker: 0.0.1

  riverpod_annotation: 4.0.8
  flutter_riverpod: 3.5.0
  get_it: 9.3.0
  injectable: 3.0.0

  gap: 3.1.0

  file_picker: 13.4.1
  platform_image_converter: 2.4.0

  flutter_displaymode: 0.7.0
  flutter_svg: 2.5.0
  url_launcher: 6.3.3

  intl: 0.20.3

  cupertino_icons: 2.0.0

  vector_graphics: 1.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: 2.16.1
  riverpod_generator: 4.0.10
  injectable_generator: 3.1.3
  flutter_gen_runner: 5.15.0

  moodiary_lint: 0.0.1

flutter:
  assets:
    # ignore: asset_directory_does_not_exist
    - assets/licenses/

  uses-material-design: true

flutter_gen:
  assets:
    exclude:
      - assets/licenses/**
  integrations:
    flutter_svg: true
