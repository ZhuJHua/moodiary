name: moodiary_mobile
description: "Open source diary app built with Flutter and Rust."
publish_to: "none"
version: 2.9.2+98
environment:
  sdk: ">=3.13.0"
  flutter: ">=3.47.0"

resolution: workspace

dependencies:
  screen_brightness: 2.1.11
  video_player: 2.14.0
  volume_controller: 3.6.1
  code_assets: 1.2.1
  hooks: 2.2.0
  flutter:
    sdk: flutter

  moodiary_content: 0.0.1
  moodiary_semantic: 0.0.1
  fast_image: 0.0.1
  moodiary_router: 0.0.1
  moodiary_assistant: 0.0.1
  moodiary_diary: 0.0.1
  moodiary_editor: 0.0.1
  moodiary_export: 0.0.1
  moodiary_lock: 0.0.1
  moodiary_media: 0.0.1
  moodiary_sync: 0.0.1
  moodiary_utils: 0.0.1
  moodiary_models: 0.0.1
  moodiary_i18n: 0.0.1
  moodiary_files: 0.0.1
  moodiary_http: 0.0.1
  moodiary_logging: 0.0.1
  moodiary_native: 0.0.1
  moodiary_platform: 0.0.1
  moodiary_storage: 0.0.1
  moodiary_theme: 0.0.1
  mui: 0.0.1
  moodiary_data: 0.0.1
  moodiary_mcp: 0.0.1
  moodiary_reminder: 0.0.1
  moodiary_ml: 0.0.1
  moodiary_migration: 0.0.1
  moodiary_preferences: 0.0.1
  moodiary_components: 0.0.1

  riverpod_annotation: 4.0.7
  flutter_riverpod: 3.4.3

  gap: 3.0.1

  file_picker: 12.2.0
  image_picker: 1.2.3
  photo_manager: 3.12.0
  provider: 6.1.5+1
  wechat_assets_picker: 10.1.3
  wechat_picker_library: 1.0.7
  async: 2.13.1
  path: 1.9.1
  platform_image_converter: 2.2.0

  flutter_displaymode: 0.7.0
  flutter_svg: 2.3.0
  url_launcher: 6.3.2

  intl: 0.20.3

  cupertino_icons: 1.0.9

  vector_graphics: 1.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  path_provider_platform_interface: 2.1.3
  shared_preferences_platform_interface: 2.4.2
  build_runner: 2.16.1
  riverpod_generator: 4.0.9
  flutter_gen_runner: 5.15.0

  moodiary_lint: 0.0.1

flutter:
  assets:
    # ignore: asset_directory_does_not_exist
    - assets/licenses/

  uses-material-design: true

flutter_gen:
  assets:
    exclude:
      - assets/licenses/**
  integrations:
    flutter_svg: true
