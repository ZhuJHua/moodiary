name: moodiary
description: "A fully open source cross-platform diary app written by flutter and rust."
publish_to: "none"
version: 2.8.0+94

environment:
  sdk: ">=3.13.0"
  flutter: ">=3.47.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter

  moodiary_rust: 0.0.1
  moodiary_router: 0.0.1
  moodiary_assistant: 0.0.1
  moodiary_diary: 0.0.1
  moodiary_editor: 0.0.1
  moodiary_export: 0.0.1
  moodiary_lock: 0.0.1
  moodiary_media: 0.0.1
  moodiary_share: 0.0.1
  moodiary_sync: 0.0.1
  moodiary_utils: 0.0.1
  moodiary_models: 0.0.1
  moodiary_i18n: 0.0.1
  moodiary_di: 0.0.1
  moodiary_files: 0.0.1
  moodiary_http: 0.0.1
  moodiary_logging: 0.0.1
  moodiary_platform: 0.0.1
  moodiary_storage: 0.0.1
  moodiary_theme: 0.0.1
  mui: 0.0.1
  moodiary_data: 0.0.1
  moodiary_migration: 0.0.1
  moodiary_preferences: 0.0.1
  moodiary_components: 0.0.1

  flutter_riverpod: 3.4.2

  gap: 3.0.1

  wechat_assets_picker: 10.1.3
  wechat_camera_picker: 4.6.0
  file_picker: 12.0.0
  provider: 6.1.5+1

  flutter_markdown_plus: 1.0.12

  flutter_displaymode: 0.7.0
  url_launcher: 6.3.2

  intl: 0.20.3
  fpdart: 1.2.0

  cupertino_icons: 1.0.9

  isar_plus: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: 2.16.0
  flutter_gen_runner: 5.15.0

  flutter_native_splash: 2.4.8

  moodiary_lint: 0.0.1

flutter_native_splash:
  color: "#ffffff"
  image: assets/icon/light/light_splash_icon.png
  color_dark: "#000000"
  image_dark: assets/icon/dark/dark_splash_icon.png

  android_12:
    image: assets/icon/light/light_splash_icon.png
    color: "#ffffff"
    image_dark: assets/icon/dark/dark_splash_icon.png
    color_dark: "#000000"
  fullscreen: true
  web: false

flutter:
  assets:
    - assets/icon/dark/
    - assets/icon/light/
    - assets/lottie/
    - res/sponsor/

  uses-material-design: true
