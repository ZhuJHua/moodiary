name: moodiary
description: "A fully open source cross-platform diary app written by flutter and rust."
publish_to: "none"
version: 2.7.3+92

environment:
  sdk: ">=3.12.0"
  flutter: ">=3.44.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter

  moodiary_rust: 0.0.1
  moodiary_router: 0.0.1
  moodiary_assistant: 0.0.1
  moodiary_diary: 0.0.1
  moodiary_editor: 0.0.1
  moodiary_lock: 0.0.1
  moodiary_media: 0.0.1
  moodiary_share: 0.0.1
  moodiary_sync: 0.0.1
  moodiary_utils: 0.0.1
  moodiary_models: 0.0.1
  moodiary_l10n: 0.0.1
  moodiary_core: 0.0.1
  moodiary_data: 0.0.1
  moodiary_preferences: 0.0.1
  moodiary_ui: 0.0.1
  moodiary_scan: 0.0.1

  go_router: 17.3.0
  flutter_riverpod: 3.3.2

  isar_plus: 1.3.7
  # 原生库 / 平台实现：无 Dart import，但必须留在 app 依赖里才会被打包与注册。
  isar_plus_flutter_libs: 1.3.7
  audioplayers_android_exo: 0.1.4

  flutter_quill: 11.5.1

  flutter_smart_dialog: 5.1.0
  gap: 3.0.1

  # IFilePicker 移动端实现（app/picker/）；provider 供自定义 picker delegate 读选择状态
  wechat_assets_picker: 10.1.2
  wechat_camera_picker: 4.5.0
  file_picker: 12.0.0-beta.7
  provider: 6.1.5+1

  font_awesome_flutter: 11.0.0
  unicons: 3.0.0
  flutter_markdown_plus: 1.0.12

  flutter_displaymode: 0.7.0
  device_info_plus: 13.2.0
  package_info_plus: 10.2.1
  url_launcher: 6.3.2

  intl: 0.20.2
  fpdart: 1.2.0
  pub_semver: 2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter

  build_runner: 2.15.1
  flutter_gen_runner: 5.15.0

  flutter_native_splash: 2.4.8
  flutter_launcher_icons: 0.14.4

  moodiary_lint: 0.0.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/light/light_foreground.png"
  adaptive_icon_monochrome: "assets/icon/light/light_foreground.png"
  image_path_ios_dark_transparent: "assets/icon/dark/dark_foreground.png"
  image_path_ios_tinted_grayscale: "assets/icon/light/light_foreground.png"
  desaturate_tinted_to_grayscale_ios: true
  image_path: "assets/icon/light/light_icon.png"
  remove_alpha_ios: true
  min_sdk_android: 26

flutter_native_splash:
  color: "#ffffff"
  image: assets/icon/light/light_splash_icon.png
  color_dark: "#000000"
  image_dark: assets/icon/dark/dark_splash_icon.png

  android_12:
    image: assets/icon/light/light_splash_icon.png
    color: "#ffffff"
    image_dark: assets/icon/dark/dark_splash_icon.png
    color_dark: "#000000"
  fullscreen: true
  web: false

flutter:
  fonts:
    - family: qweather
      fonts:
        - asset: assets/fonts/qweather-icons.ttf

  assets:
    - assets/icon/dark/
    - assets/icon/light/
    - assets/lottie/
    - res/sponsor/

  uses-material-design: true
