name: moodiary
description: "A fully open source cross-platform diary app written by flutter and rust."
publish_to: "none"
version: 2.7.4+93

environment:
  sdk: ">=3.12.0"
  flutter: ">=3.44.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter

  moodiary_rust: 0.0.1
  moodiary_router: 0.0.1
  moodiary_assistant: 0.0.1
  moodiary_diary: 0.0.1
  moodiary_editor: 0.0.1
  moodiary_lock: 0.0.1
  moodiary_media: 0.0.1
  moodiary_share: 0.0.1
  moodiary_sync: 0.0.1
  moodiary_utils: 0.0.1
  moodiary_models: 0.0.1
  moodiary_l10n: 0.0.1
  moodiary_core: 0.0.1
  moodiary_data: 0.0.1
  moodiary_migration: 0.0.1
  moodiary_preferences: 0.0.1
  moodiary_ui: 0.0.1

  flutter_riverpod: 3.3.2

  gap: 3.0.1

  # IFilePicker 移动端实现（app/picker/）；provider 供自定义 picker delegate 读选择状态
  wechat_assets_picker: 10.1.3
  wechat_camera_picker: 4.6.0
  file_picker: 12.0.0-beta.7
  provider: 6.1.5+1

  unicons: 3.0.0
  flutter_markdown_plus: 1.0.12

  flutter_displaymode: 0.7.0
  url_launcher: 6.3.2

  intl: 0.20.2
  fpdart: 1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: 2.15.1
  flutter_gen_runner: 5.15.0

  flutter_native_splash: 2.4.8

  moodiary_lint: 0.0.1

flutter_native_splash:
  color: "#ffffff"
  image: assets/icon/light/light_splash_icon.png
  color_dark: "#000000"
  image_dark: assets/icon/dark/dark_splash_icon.png

  android_12:
    image: assets/icon/light/light_splash_icon.png
    color: "#ffffff"
    image_dark: assets/icon/dark/dark_splash_icon.png
    color_dark: "#000000"
  fullscreen: true
  web: false

flutter:
  fonts:
    - family: qweather
      fonts:
        - asset: assets/fonts/qweather-icons.ttf

  assets:
    - assets/icon/dark/
    - assets/icon/light/
    - assets/lottie/
    - res/sponsor/

  uses-material-design: true
