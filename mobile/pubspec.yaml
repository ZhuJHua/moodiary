  flutter_displaymode: 0.7.0
  flutter_svg: 2.5.1
  url_launcher: 6.3.3

  intl: 0.20.3

  cupertino_icons: 2.0.0

  vector_graphics: 1.3.1

dev_dependencies:
  flutter_test:
