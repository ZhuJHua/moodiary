name: Android Release

on:
  workflow_call:
    inputs:
      ref:
        description: 'Commit SHA or tag to build and release'
        required: false
        type: string
      publish_draft:
        description: 'Create/update draft GitHub release'
        required: false
        default: false
        type: boolean
  workflow_dispatch:
  push:
    branches:
      - 'fdroid_inclusion_sqlite_build'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    name: Build APK
    outputs:
      commit: ${{ steps.resolve_commit.outputs.sha }}
    env:
      # Match F-Droid's recipe (`export PUB_CACHE=$(pwd)/.pub-cache`) for reproducible native builds.
      PUB_CACHE: ${{ github.workspace }}/.pub-cache

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Resolve Commit SHA
        id: resolve_commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set Up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Read Flutter Version
        id: flutter_version
        run: |
          if [ -f .fvmrc ]; then
            FLUTTER_VERSION=$(cat .fvmrc | jq -r '.flutter')
            echo "Flutter version detected: $FLUTTER_VERSION"
            echo "flutter-version=$FLUTTER_VERSION" >> $GITHUB_ENV
          else
            echo ".fvmrc not found. Defaulting to latest Flutter version."
            echo "flutter-version=stable" >> $GITHUB_ENV
          fi

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.flutter-version }}

      - name: Set Up Rust
        working-directory: packages/foundation/fast_image/rust
        run: rustup show active-toolchain

      - name: Install cargo-about
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2

      - name: Install Dependencies
        working-directory: mobile
        run: flutter pub get --enforce-lockfile

      - name: Set Up NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          link-to-sdk: true

      - name: Prepare Android signing
        env:
          ANDROID_KJS: ${{ secrets.ANDROID_KJS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KJS" ] || [ -z "$ANDROID_STORE_PASSWORD" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "Android release signing secrets are required." >&2
            exit 1
          fi
          umask 077
          printf '%s' "$ANDROID_KJS" | base64 --decode > "$RUNNER_TEMP/moodiary-release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/moodiary-release.jks" \
            "$ANDROID_STORE_PASSWORD" \
            "$ANDROID_KEY_PASSWORD" > mobile/android/local.properties

      - name: Build APK
        working-directory: mobile
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK: ${{ steps.ndk.outputs.ndk-path }}
        run: flutter build apk --flavor production --release --target-platform android-arm64

      - name: Verify APK Native Libraries & Signing Block
        run: |
          dart tool/check_apk_ndk.dart \
            --expect 28.2.13676358 \
            --sqlite-header third_party/sqlite3/sqlite3.h \
            mobile/build/app/outputs/flutter-apk/app-production-release.apk

      - name: Report Signing Certificate
        continue-on-error: true
        run: |
          set -uo pipefail
          apksigner="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name apksigner 2>/dev/null | sort -V | tail -1)"
          if [ -z "$apksigner" ]; then
            echo '::warning::apksigner not found — skipping certificate report.'
            exit 0
          fi
          {
            echo '## Signing certificate'
            echo '```'
            "$apksigner" verify --print-certs mobile/build/app/outputs/flutter-apk/app-production-release.apk | grep -i 'SHA-256 digest' || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: mobile/build/app/outputs/flutter-apk/app-production-release.apk

  release:
    runs-on: ubuntu-latest
    name: Publish Release
    needs: [ build-apk ]
    if: inputs.publish_draft == true
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.build-apk.outputs.commit }}

      - name: Download APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: artifacts/android

      - name: Read Version From Pubspec
        run: |
          version=$(sed -n 's/^version: \([0-9.]*\)+.*/\1/p' mobile/pubspec.yaml)
          if [ -z "$version" ]; then
            echo "could not read version from mobile/pubspec.yaml" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v${version}" >/dev/null 2>&1; then
            echo "::error::Tag v${version} already exists on origin; refusing to overwrite." >&2
            exit 1
          fi
          echo "Version detected: $version"
          echo "VERSION=$version" >> $GITHUB_ENV

      - name: Rename Artifacts & Checksums
        run: |
          mkdir -p renamed-artifacts
          mv artifacts/android/app-production-release.apk "renamed-artifacts/moodiary-${VERSION}-android-arm64.apk"
          (cd renamed-artifacts && sha256sum "moodiary-${VERSION}-android-arm64.apk" > SHA256SUMS.txt)

      - name: Extract Release Notes From Changelog
        run: |
          awk -v want="## [${{ env.VERSION }}]" '
            index($0, want) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "no [${{ env.VERSION }}] section in CHANGELOG.md" >&2
            exit 1
          fi
          cat release-notes.md

      - name: Create Draft Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: renamed-artifacts/*
          artifactErrorsFailBuild: true
          tag: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          bodyFile: release-notes.md
          commit: ${{ needs.build-apk.outputs.commit }}
          draft: true
          prerelease: false
          allowUpdates: true
          updateOnlyUnreleased: true
          token: ${{ secrets.GITHUB_TOKEN }}
