name: Label PR Based on Conventional Commits

on:
  pull_request_target:
    types: [ opened, edited, synchronize, reopened ]

permissions:
  pull-requests: write

jobs:
  label-pr:
    if: github.event.action != 'edited' || github.event.changes.title
    runs-on: ubuntu-latest

    steps:
      - name: Add Label to PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          types=(feat fix chore docs style refactor perf test build ci revert '?')
          label='?'
          for t in "${types[@]}"; do
            if [[ $PR_TITLE == "$t"* ]]; then label=$t; break; fi
          done

          api="repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels"
          current=$(gh api "$api" --jq '.[].name')
          for t in "${types[@]}"; do
            if [[ $t != "$label" ]] && grep -qxF -- "$t" <<<"$current"; then
              gh api --method DELETE "$api/$(jq -rn --arg s "$t" '$s|@uri')" --silent
            fi
          done
          gh api --method POST "$api" -f "labels[]=$label" --silent
