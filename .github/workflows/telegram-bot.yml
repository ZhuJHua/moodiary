name: Release Notification

on:
  release:
    types:
      - released
  workflow_dispatch:

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  notify-telegram:
    name: Notify Telegram
    runs-on: ubuntu-latest

    steps:
      - name: Extract Release Info
        id: extract_release
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "release" ]; then
            payload=$(jq '.release' "$GITHUB_EVENT_PATH")
          else
            payload=$(curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/latest")
          fi
          RELEASE_TAG=$(printf '%s' "$payload" | jq -er '.tag_name')
          RELEASE_URL=$(printf '%s' "$payload" | jq -er '.html_url')
          RELEASE_NOTES=$(printf '%s' "$payload" | jq -r '(.body // "")[0:3500]')
          {
            echo "RELEASE_TAG=$RELEASE_TAG"
            echo "RELEASE_URL=$RELEASE_URL"
            echo "RELEASE_NOTES<<EOF"
            printf '%s\n' "$RELEASE_NOTES"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Send Telegram Message
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            🎉 A new release is live! 🎉

            Version: ${{ env.RELEASE_TAG }}

            Release Notes:
            ${{ env.RELEASE_NOTES }}

            🔗 View Release: ${{ env.RELEASE_URL }}