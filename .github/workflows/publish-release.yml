name: Publish Release

on:
  pull_request:
    types: [ closed ]
    branches: [ develop ]

# Merging a `release/*` PR builds directly from `merge_commit_sha` so tag `vX.Y.Z` and the APK match.
jobs:
  build-android:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/')
    permissions:
      contents: write
    uses: ./.github/workflows/android-release.yml
    with:
      ref: ${{ github.event.pull_request.merge_commit_sha }}
    secrets: inherit

  build-ios:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/')
    permissions:
      contents: read
    uses: ./.github/workflows/ios-release.yml
    with:
      ref: ${{ github.event.pull_request.merge_commit_sha }}
    secrets: inherit
