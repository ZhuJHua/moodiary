name: Sponsors

on:
  workflow_dispatch:
  push:
    branches: [ develop ]
    paths:
      - 'sponsors.json'
      - 'tool/sponsors.dart'
  pull_request:
    paths:
      - 'sponsors.json'
      - 'tool/sponsors.dart'
      - 'res/sponsor/sponsors_*.svg'

concurrency:
  group: sponsors-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  render:
    name: Render sponsor wall
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read Flutter version
        id: fv
        run: echo "version=$(jq -r '.flutter' .fvmrc)" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fv.outputs.version }}

      - name: Render
        run: dart run tool/sponsors.dart

      # PR 只验证产物是最新的，不回写；推到 develop 才提交
      - name: Check artefacts are up to date
        if: github.event_name == 'pull_request'
        run: |
          if ! git diff --quiet -- res/sponsor; then
            echo "::error::sponsors.json 改了但 SVG 没重新生成，请跑 dart tool/task.dart sponsors 并提交产物"
            git diff --stat -- res/sponsor
            exit 1
          fi

      - name: Commit
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet -- res/sponsor; then
            echo "捐助者墙没有变化，跳过提交。"
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add res/sponsor
          git commit -m 'chore(sponsors): re-render the sponsor wall'
          git push
