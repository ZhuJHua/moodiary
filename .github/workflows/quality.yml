name: Quality & Tests

on:
  workflow_dispatch:
  pull_request:
    branches: [ develop ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dart:
    name: Dart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read Flutter version
        id: fv
        run: echo "version=$(jq -r '.flutter' .fvmrc)" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fv.outputs.version }}

      - name: Set up Melos (bootstrap)
        uses: bluefireteam/melos-action@v3
        with:
          melos-version: 8.2.2

      - name: Check generated bindings
        run: dart tool/check_generated.dart

      - name: Analyze
        run: flutter analyze

      - name: Check layer dependencies
        run: dart tool/check_layers.dart

      - name: Set up Rust toolchain
        working-directory: packages/foundation/moodiary_rust/rust
        run: rustup toolchain install

      # 真库集成测试（倒排索引 / 2.8.0 迁移）靠这个变量解除 skip；动态库随
      # isar_plus_flutter_libs 的 pub 包分发，bootstrap 之后就在磁盘上。
      # 版本精确匹配 pubspec 钉的 isar_plus——升级后忘了改这里会 exit 1，
      # 而不是静默退回「全部跳过」。
      - name: Locate Isar test dylib
        run: |
          so=$(find "${PUB_CACHE:-$HOME/.pub-cache}/hosted/pub.dev" \
            -path '*isar_plus_flutter_libs-1.3.9/linux/libisar_plus.so' | head -1)
          if [ -z "$so" ]; then
            echo "libisar_plus.so not found in pub cache (isar_plus upgraded? update this step)" >&2
            exit 1
          fi
          echo "ISAR_TEST_DYLIB=$so" >> "$GITHUB_ENV"

      - name: Test
        run: melos exec --dir-exists=test --fail-fast -c 1 -- flutter test

  rust:
    name: Rust
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/foundation/moodiary_rust/rust
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  editor:
    name: Editor
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/feature/moodiary_editor/editor
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install
        run: corepack pnpm install --frozen-lockfile

      - name: Type-check
        run: corepack pnpm type-check

      - name: Test
        run: corepack pnpm test
