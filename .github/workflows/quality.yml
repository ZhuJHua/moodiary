name: Quality & Tests

on:
  workflow_dispatch:
  pull_request:
    branches: [ develop ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dart:
    name: Dart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read Flutter version
        id: fv
        run: echo "version=$(jq -r '.flutter' .fvmrc)" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fv.outputs.version }}

      - name: Set up Melos (bootstrap)
        uses: bluefireteam/melos-action@v3
        with:
          melos-version: 8.2.2

      - name: Analyze
        run: flutter analyze

      - name: Check layer dependencies
        run: dart tool/check_layers.dart

      - name: Set up Rust toolchain
        working-directory: packages/foundation/moodiary_rust/rust
        run: rustup toolchain install

      - name: Test
        run: melos exec --dir-exists=test --fail-fast -c 1 -- flutter test

  rust:
    name: Rust
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/foundation/moodiary_rust/rust
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

  editor:
    name: Editor
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/feature/moodiary_editor/editor
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install
        run: corepack pnpm install --frozen-lockfile

      - name: Type-check
        run: corepack pnpm type-check

      - name: Test
        run: corepack pnpm test
